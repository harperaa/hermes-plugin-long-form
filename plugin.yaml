name: youtube-insights
version: 1.0.0
description: >
  YouTube competitive intelligence and content production — track competitor
  channels, pull transcripts, rank videos by views-per-hour (VPH), mine
  transcripts into a deduplicated insight knowledge base, and turn insights
  into concepts, scripts, and Grok-generated beat images. Dashboard tab with
  YouTube Research, Trends, Insights, and Artifacts pages.
author: Allen Harper
kind: standalone
manifest_version: 1

requires_env:
  - name: TRANSCRIPT_API_KEY
    description: "API key for transcriptapi.com (YouTube transcripts + channel metadata)"
    url: "https://transcriptapi.com"
    secret: true
  - name: APIFY_API_TOKEN
    description: "Apify token — exact views/likes/comments and comment bodies for the research shortlist (optional; Tier 2/3 only)"
    url: "https://console.apify.com/account/integrations"
    secret: true
  - name: GEMINI_API_KEY
    description: "Google Gemini API key — image generation fallback, only used when no xAI credential is connected"
    url: "https://aistudio.google.com/apikey"
    secret: true

provides_tools:
  - yt_add_channel
  - yt_remove_channel
  - yt_list_channels
  - yt_fetch_videos
  - yt_trending
  - yt_trigger_analysis
  - yt_add_insight
  - yt_search_insights
  - yt_lint_script
  - yt_research

provides_hooks:
  - kanban_task_completed
